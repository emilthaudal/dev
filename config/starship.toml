# Starship config — Catppuccin Mocha palette (matches herdr theme)
# https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# Wait 10ms for starship to check files under current directory.
scan_timeout = 10
command_timeout = 500

# Inserts a blank line between shell prompts
add_newline = true

# ── PROMPT FORMAT ────────────────────────────────────────────────────────────
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$nodejs\
$bun\
$python\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── OS ───────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bg:#313244 fg:#cba6f7"

[os.symbols]
Macos = " "

# ── USERNAME ────────────────────────────────────────────────────────────────
[username]
show_always = false
style_user = "bg:#313244 fg:#cdd6f4"
style_root = "bg:#313244 fg:#f38ba8"
format = '[$user ]($style)'
disabled = false

# ── DIRECTORY ───────────────────────────────────────────────────────────────
[directory]
style = "fg:#89b4fa"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "fg:#f38ba8"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── GIT ──────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = "fg:#f38ba8"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰦎 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "? "
stashed = " "
modified = "! "
staged = "+ "
renamed = "» "
deleted = "✘ "

# ── LANGUAGES ────────────────────────────────────────────────────────────────
[nodejs]
symbol = " "
style = "fg:#a6e3a1"
format = '[$symbol($version )]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
symbol = " "
style = "fg:#f9e2af"
format = '[$symbol($version )]($style)'

[python]
symbol = " "
style = "fg:#f9e2af"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[rust]
symbol = " "
style = "fg:#fab387"
format = '[$symbol($version )]($style)'

[docker_context]
symbol = " "
style = "fg:#89dceb"
format = '[$symbol$context ]($style)'
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ── CMD DURATION ────────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2_000
style = "fg:#f9e2af"
format = ' [󱑂 $duration]($style) '

# ── CHARACTER ───────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](fg:#a6e3a1)"
error_symbol = "[❯](fg:#f38ba8)"
vimcmd_symbol = "[❮](fg:#cba6f7)"
