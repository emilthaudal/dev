# Starship config — Embark palette (matches Ghostty theme)
# https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

palette = "embark"

# Wait 10ms for starship to check files under current directory.
scan_timeout = 10
command_timeout = 500

# Inserts a blank line between shell prompts
add_newline = true

# ── PROMPT FORMAT ────────────────────────────────────────────────────────────
format = """
$os\
$username\
$directory\
$git_branch\
$git_status\
$git_metrics\
$aws\
$nodejs\
$bun\
$python\
$rust\
$docker_context\
$cmd_duration\
$line_break\
$character"""

# ── OS ───────────────────────────────────────────────────────────────────────
[os]
disabled = false
style = "bg:surface fg:purple"

[os.symbols]
Macos = " "

# ── USERNAME ────────────────────────────────────────────────────────────────
[username]
show_always = false
style_user = "bg:surface fg:text"
style_root = "bg:surface fg:red"
format = '[$user ]($style)'
disabled = false

# ── DIRECTORY ───────────────────────────────────────────────────────────────
[directory]
style = "fg:blue"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 4
truncation_symbol = "…/"
truncate_to_repo = false
read_only = " 󰌾"
read_only_style = "fg:red"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = "󰝚 "
"Pictures" = " "
"Developer" = "󰲋 "

# ── GIT ──────────────────────────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "fg:green"
format = '[$symbol$branch(:$remote_branch)]($style) '

[git_status]
style = "fg:red"
format = '([$all_status$ahead_behind]($style) )'
conflicted = "󰦎 ${count} "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
up_to_date = ""
untracked = "?${count} "
stashed = ""
modified = "!${count} "
staged = "+${count} "
renamed = "»${count} "
deleted = "✘${count} "

[git_metrics]
disabled = false
added_style = "fg:green"
deleted_style = "fg:red"
format = '([+$added]($added_style) )([-$deleted]($deleted_style) )'

# ── AWS ──────────────────────────────────────────────────────────────────────
[aws]
symbol = "  "
style = "fg:orange"
format = '[$symbol$profile(\($region\))]($style) '

# ── LANGUAGES ────────────────────────────────────────────────────────────────
[nodejs]
symbol = " "
style = "fg:green"
format = '[$symbol($version )]($style)'
detect_files = ["package.json", ".node-version", ".nvmrc"]
detect_folders = ["node_modules"]

[bun]
symbol = " "
style = "fg:yellow"
format = '[$symbol($version )]($style)'

[python]
symbol = " "
style = "fg:yellow"
format = '[$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
detect_extensions = ["py"]
detect_files = ["pyproject.toml", "requirements.txt", ".python-version", "Pipfile"]

[rust]
symbol = " "
style = "fg:orange"
format = '[$symbol($version )]($style)'

[docker_context]
symbol = " "
style = "fg:cyan"
format = '[$symbol$context ]($style)'
only_with_files = true
detect_files = ["docker-compose.yml", "docker-compose.yaml", "Dockerfile"]

# ── CMD DURATION ────────────────────────────────────────────────────────────
[cmd_duration]
min_time = 2_000
style = "fg:yellow"
format = ' [󱑂 $duration]($style) '

# ── CHARACTER ───────────────────────────────────────────────────────────────
[character]
success_symbol = "[❯](fg:green)"
error_symbol = "[❯](fg:red)"
vimcmd_symbol = "[❮](fg:purple)"

# ── PALETTE ─────────────────────────────────────────────────────────────────
[palettes.embark]
surface = "#2d2b40"
text = "#cbe3e7"
purple = "#c792ea"
blue = "#91ddff"
cyan = "#87dfeb"
green = "#a1efd3"
yellow = "#ffe6b3"
orange = "#f2b482"
red = "#f48fb1"
